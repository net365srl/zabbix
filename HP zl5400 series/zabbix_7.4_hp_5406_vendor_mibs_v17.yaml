      tags:
      - tag: component
        value: vendor-hp
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
    - uuid: f069bf506ae1423484ac04a2d45507db
      name: 'HP IP routing: Total route count'
      type: SNMP_AGENT
