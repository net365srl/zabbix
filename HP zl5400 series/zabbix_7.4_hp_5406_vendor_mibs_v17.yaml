    - uuid: 93f2b1587ed34384870c659ca0bee7ff
      name: 'SNMP traps: Unmatched trap'
      type: SNMP_TRAP
      key: snmptrap.fallback
      history: 30d
      value_type: LOG
      trends: '0'
      description: Receives traps from this switch not matched by another snmptrap[regexp] item.
      tags:
      - tag: component
        value: snmp
    - uuid: b9721d7d1cd2440fb5a9e584120cbc34
