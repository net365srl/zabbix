      history: 30d
      trends: 365d
      tags:
      - tag: component
        value: vendor-hp
      status: DISABLED
      description: 'Disabled by default: the monitored J8697A agent returned No Such Object for this vendor OID. Enable only after confirming this OID is implemented by the installed firmware and routing feature set.'
    - uuid: ff135db0299546f4925a3b028f861ca1
