      snmp_oid: 1.3.6.1.4.1.11.2.14.11.5.1.15.3.1.0
      delay: 5m
      history: 30d
      trends: 365d
      tags:
      - tag: component
        value: vendor-hp
    - uuid: bfb2307009914992999a2bc072eb539c
