zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: e6dea3ff750d4f7e92730ef2b227d1be
    name: Templates/Network devices
  templates:
  - uuid: 461398696d92438a90a3abc9396c7cab
    template: HP ProCurve 5406 by SNMP
    name: HP ProCurve 5406 by SNMP
    description: 'Zabbix 7.4 SNMP template for HP ProCurve 5406 with IF-MIB and HP vendor-specific monitoring.


      Compatibility note: HP OSPF reference-cost polling is disabled by default because the target J8697A returned No Such Object. Temperature items named "HP J8697A Switch temperature sensor..." are not created by this template;
      they originate from another linked template or pre-existing host discovery and should be disabled/unlinked there on this agent. Chassis health remains covered by hpicfSensorTrap and Fault Finder trap items.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 9695ce9e8d774a81bd6da70fe36fb805
      name: System name
      type: SNMP_AGENT
      key: system.name
      snmp_oid: 1.3.6.1.2.1.1.5.0
      delay: 1h
      history: 30d
      value_type: CHAR
      trends: 365d
      tags:
      - tag: component
        value: system
    - uuid: c23807355e854536b75d7b0ce825f18c
      name: System description
      type: SNMP_AGENT
      key: system.descr
      snmp_oid: 1.3.6.1.2.1.1.1.0
      delay: 1h
      history: 30d
      value_type: TEXT
      trends: 365d
      tags:
      - tag: component
        value: system
    - uuid: 3f752a75797244a9808e1f9e831e32d9
      name: System location
      type: SNMP_AGENT
      key: system.location
      snmp_oid: 1.3.6.1.2.1.1.6.0
      delay: 1h
      history: 30d
      value_type: CHAR
      trends: 365d
      tags:
      - tag: component
        value: system
    - uuid: 2ae8df80ac044dec8f360fea0404c221
      name: System contact
      type: SNMP_AGENT
      key: system.contact
      snmp_oid: 1.3.6.1.2.1.1.4.0
      delay: 1h
      history: 30d
      value_type: CHAR
      trends: 365d
      tags:
      - tag: component
        value: system
    - uuid: cbc67e7f629f4dd3bb6604b8136f4fa3
      name: System object ID
      type: SNMP_AGENT
      key: system.objectid
      snmp_oid: 1.3.6.1.2.1.1.2.0
      delay: 1h
      history: 30d
      value_type: CHAR
      trends: 365d
      tags:
      - tag: component
        value: system
    - uuid: 5ba49fc4756f4b4eb0795cfdd130908b
      name: System uptime
      type: SNMP_AGENT
      key: system.uptime
      snmp_oid: 1.3.6.1.2.1.1.3.0
      delay: 5m
      history: 30d
      trends: 365d
      units: uptime
      tags:
      - tag: component
        value: system
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      triggers:
      - uuid: 16f89d4c123645f09addc39dc045bdaf
        expression: last(/HP ProCurve 5406 by SNMP/system.uptime)<10m
        name: Switch has been restarted
        priority: WARNING
    - uuid: 87a25c0844b945e9abe16b243123fd1e
      name: SNMP availability check
      type: SNMP_AGENT
      key: snmp.check
      snmp_oid: 1.3.6.1.2.1.1.3.0
      delay: 1m
      history: 30d
      trends: 365d
      tags:
      - tag: component
        value: health
    - uuid: 723a47bb21f24b0490e6c3a1fc93bbe3
      name: Total inbound throughput
      type: CALCULATED
      key: net.if.total.in
      delay: 1m
      history: 30d
      value_type: FLOAT
      trends: 365d
      units: bps
      params: sum(last_foreach(//net.if.in[*]))
      tags:
      - tag: component
        value: network
    - uuid: 7cfaffde99be4d0ab79e258f9a4be0b0
      name: Total outbound throughput
      type: CALCULATED
      key: net.if.total.out
      delay: 1m
      history: 30d
      value_type: FLOAT
      trends: 365d
      units: bps
      params: sum(last_foreach(//net.if.out[*]))
      tags:
      - tag: component
        value: network
    - uuid: fa2b684ee3224da3bec703af06480983
      name: Total aggregate throughput
      type: CALCULATED
      key: net.if.total
      delay: 1m
      history: 30d
      value_type: FLOAT
      trends: 365d
      units: bps
      params: last(//net.if.total.in)+last(//net.if.total.out)
      tags:
      - tag: component
        value: network
    - uuid: 2974e3edb5844fb0a614d3926c4dbbf8
      name: 'HP HA: Redundancy failure reason'
      type: SNMP_AGENT
      key: hp.ha.failure.reason
      snmp_oid: 1.3.6.1.4.1.11.2.14.11.1.11.2.1.0
      delay: 5m
      history: 30d
      trends: 365d
      tags:
      - tag: component
