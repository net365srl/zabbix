    discovery_rules:
    - uuid: 5b6c221175914ca99d717fac9e9d6b99
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      item_prototypes:
      - uuid: ae3086a7c5d941bc8edefeb57f87bb20
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.status[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        trends: 365d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: IF-MIB::ifOperStatus
        trigger_prototypes:
        - uuid: 2d0f90bf62d14ccfb5a64e16785941cc
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/HP ProCurve 5406 by SNMP/net.if.status[{#SNMPINDEX}])<>1 and count(/HP ProCurve 5406 by SNMP/net.if.status[{#SNMPINDEX}],2h,"eq",1)>0'
          name: 'Interface {#IFNAME}: Link down'
          priority: INFO
          description: Information event generated only after a transition from up to a non-up state. If the interface stays down, the problem closes automatically when the last up sample leaves the 2-hour evaluation window.
            If the interface returns up earlier, it closes immediately.
      - uuid: a5f9f635f5eb46e2a2270348b0806be5
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        trends: 365d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters: []
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 990f5b714ffd46ea9f864ea9711fbfc8
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        trends: 365d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
