  triggers:
  - uuid: 490183f33c8f4af28df57a489d94f88d
    expression: max(/HPE Instant On 1930 by SNMP/icmpping,#3)=0
    name: Unavailable by ICMP ping
    priority: HIGH
    description: The switch is not responding to ICMP requests.
    manual_close: 'YES'
    tags:
    - tag: scope
      value: availability
  - uuid: ba6c9f480b35497ab15b556042a64f2e
    expression: max(/HPE Instant On 1930 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
    name: No SNMP data collection
    priority: WARNING
    description: SNMP agent is not responding. Check community, SNMP ACLs and connectivity.
    manual_close: 'YES'
    tags:
    - tag: scope
      value: availability
    dependencies:
    - name: Unavailable by ICMP ping
      expression: max(/HPE Instant On 1930 by SNMP/icmpping,#3)=0
  - uuid: 881f311cc62046c691666be30437d4cf
    expression: min(/HPE Instant On 1930 by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/HPE Instant On 1930 by SNMP/icmppingloss,5m)<100
    name: High ICMP ping loss
    priority: WARNING
    description: ICMP packet loss above threshold.
    manual_close: 'YES'
    tags:
    - tag: scope
      value: performance
  - uuid: 89e2962154a846b99a4931f86b52406b
    expression: last(/HPE Instant On 1930 by SNMP/system.net.uptime)<10m
    name: Device has been restarted
    priority: INFO
    description: 'Uptime below 10 minutes: the switch has been restarted.'
    manual_close: 'YES'
    tags:
    - tag: scope
      value: notice
  - uuid: ec3e9313622c46c78b441a3c146da084
    expression: min(/HPE Instant On 1930 by SNMP/system.cpu.util,5m)>{$CPU.UTIL.CRIT}
    name: High CPU utilization
    priority: WARNING
    description: CPU utilization above {$CPU.UTIL.CRIT}% for 5 minutes.
    manual_close: 'YES'
    tags:
    - tag: scope
      value: performance
  - uuid: 112e1c112f8446909654ead8a0b0a562
    expression: last(/HPE Instant On 1930 by SNMP/system.hw.status)=2
    name: Hardware health is in problem state
    priority: HIGH
    description: genGroupHWStatus reports hardwareProblems(2).
    manual_close: 'YES'
    tags:
    - tag: scope
      value: availability
  - uuid: e048fcc1c2a84fafb09343d3dcba3e7e
    expression: last(/HPE Instant On 1930 by SNMP/system.boot.version,#1)<>last(/HPE Instant On 1930 by SNMP/system.boot.version,#2) and length(last(/HPE Instant On 1930 by SNMP/system.boot.version))>0
    name: Firmware/boot version has changed
    priority: INFO
    description: Firmware/boot version changed.
    manual_close: 'YES'
    tags:
    - tag: scope
      value: notice
