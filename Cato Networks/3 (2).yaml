      - type: JAVASCRIPT
        parameters:
        - var d=JSON.parse(value).data.accountMetrics.sites||[];var out=[];for(var i=0;i<d.length;i++){var ifs=d[i].interfaces||[];for(var j=0;j<ifs.length;j++){out.push({"{#SITE.ID}":String(d[i].id),"{#SITE.NAME}":d[i].name,"{#IF.NAME}":ifs[j].name});}}return JSON.stringify(out);
      master_item:
        key: cato.metrics.raw
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.MATCHES}'
          formulaid: A
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
