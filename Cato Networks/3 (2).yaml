zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 6f5b0c0fc98d42ce8442b74c9e0e81ec
    name: Templates/Network devices
  templates:
  - uuid: 584807b3cfc243afbc1255f303119971
    template: Cato Networks by HTTP
    name: Cato Networks by HTTP
    description: |-
      Template to monitor a Cato Networks SASE account through the Cato GraphQL API (HTTP agent).

      Master HTTP items call the Cato GraphQL API; LLD + dependent items build per-site / per-WAN-link /
      per-BGP-peer metrics WITHOUT extra API calls, respecting Cato API rate limiting.

      Cato GraphQL APIs consumed: accountSnapshot, accountMetrics, entityLookup, eventsFeed. BGP peer status is
      DISABLED by default (its schema field is not stable/universal); enable it after verifying the query.
      Model: ONE Zabbix host = ONE Cato account.

      Robustness: every master item has an 'API errors' sentinel; count/inventory items fall back to 0 so a
      missing permission or EA/Beta field never cascades into 'not supported' calculated items.
      Honeycomb widgets show the SITE name (primary_label regsub). Per-site telemetry graphs use wildcard item
      patterns so EVERY site/link is plotted as its own line (multi-site aware). 'health' is not collected by default.
      eventsFeed uses marker-based pagination and requires Event Feed enabled in the CMA.

      Setup: create a read-only Cato API key restricted to the Zabbix source IP, link this template to a host,
      and set {$CATO.API.KEY} and {$CATO.ACCOUNT.ID}. See docs/INSTALL.md. License: MIT-0. Version 2.0.7.
    wizard_ready: 'YES'
    vendor:
      name: Community
      version: 2.0.7
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 9feab0d97016400786e53b49b7998095
      name: 'Cato: Get account snapshot'
      type: HTTP_AGENT
      key: cato.snapshot.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.SNAPSHOT.INTERVAL}'
      timeout: 30s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query accountSnapshot($accountID:ID!){accountSnapshot(accountID:$accountID){id sites{id connectivityStatus operationalStatus lastConnected connectedSince popName hostCount info{name type countryName region} devices{id name connected haRole lastConnected lastPopName type uptimeSeconds socketInfo{serial version} interfaces{id name physicalPort connected}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: snapshot
    - uuid: 34e89ddd4d0845ea96f9f7db00e6944f
      name: 'Cato: Get account metrics'
      type: HTTP_AGENT
      key: cato.metrics.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.METRICS.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query accountMetrics($accountID:ID!,$timeFrame:TimeFrame!){accountMetrics(accountID:$accountID,timeFrame:$timeFrame,groupDevices:true){from to sites{id name interfaces{name metrics{bytesDownstream bytesUpstream bytesTotal lostDownstreamPcnt lostUpstreamPcnt jitterUpstream jitterDownstream rtt packetsDiscardedDownstream packetsDiscardedUpstream}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}","timeFrame":"{$CATO.METRICS.TIMEFRAME}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: metrics
    - uuid: bf127b52d7694c3890ae83c85fc25943
      name: 'Cato: Get BGP status'
      type: HTTP_AGENT
      key: cato.bgp.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.BGP.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query bgp($accountID:ID!){accountSnapshot(accountID:$accountID){sites{id info{name} devices{bgpStatus{peers{peerName peerAsn catoAsn peerIp state uptime advertisedRoutes receivedRoutes}}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: bgp
      description: 'DISABLED BY DEFAULT. The BGP peer status field is NOT part of the public/stable Cato schema and differs per account (bgpStatus is not on DeviceSnapshot). To enable BGP monitoring: (1) open the Cato GraphQL Playground, run introspection and find the correct BGP status query for your account; (2) replace the query in this item; (3) enable this item and the "Cato: BGP peer discovery" LLD rule. Until then, keeping it disabled avoids GraphQL validation errors.'
      status: DISABLED
    - uuid: 75bb9b152e974d94a23546c1893739ea
      name: 'Cato: Get entity inventory (sites)'
      type: HTTP_AGENT
      key: cato.entities.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.INVENTORY.INTERVAL}'
      timeout: 30s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query entityLookup($accountID:ID!){entityLookup(accountID:$accountID,type:site){total items{entity{id name type}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: entities
      description: 'entityLookup type=site: authoritative count of configured sites for drift detection. Needs Accounts/Sites read permission.'
    - uuid: 8a47e23a5872421faa3ed698da7aaedc
      name: 'Cato: Get events summary'
      type: HTTP_AGENT
      key: cato.events.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.EVENTS.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query events($accountID:ID!){eventsFeed(accountIDs:[$accountID],marker:\"\"){fetchedCount marker}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: events
      description: eventsFeed uses marker-based pagination (max 3000 events/fetch). Requires Event Feed enabled + Events permission.
    - uuid: d8d45741deee4b16a7e0735f6eb3a7b4
      name: 'Cato: API errors (snapshot)'
      type: DEPENDENT
      key: cato.snapshot.errors
      value_type: TEXT
      description: Non-empty when accountSnapshot returns errors[].
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: health
    - uuid: d8cb549498f04f009db84bac8753f79b
      name: 'Cato: Metrics API errors'
      type: DEPENDENT
      key: cato.metrics.errors
      value_type: TEXT
      description: Non-empty when accountMetrics returns errors[] (e.g. an invalid field for your account).
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: health
    - uuid: b9dd1396b47d4db6b6a2639a758f7f79
      name: 'Cato: Entity inventory API errors'
      type: DEPENDENT
      key: cato.entities.errors
      value_type: TEXT
      description: Non-empty when entityLookup returns errors[] (usually a missing Accounts/Sites permission).
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.entities.raw
      tags:
      - tag: component
        value: health
    - uuid: 6ec07c532e424cf194d5a582b2bc1ff1
      name: 'Cato: BGP API errors'
      type: DEPENDENT
      key: cato.bgp.errors
      value_type: TEXT
      description: Non-empty when the BGP query returns errors[].
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.bgp.raw
      tags:
      - tag: component
        value: health
    - uuid: d4efff0ad48940f99cf6ee8254530f44
      name: 'Cato: Events API errors'
      type: DEPENDENT
      key: cato.events.errors
      value_type: TEXT
      description: Non-empty if eventsFeed returns errors[].
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.events.raw
      tags:
      - tag: component
        value: health
    - uuid: f68b9de89c524ec5ab2d97cfcacd56c4
      name: 'Cato: Sites total'
      type: DEPENDENT
      key: cato.sites.total
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites.length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 96ef31a8ae6a4c8aa2201f4d13d803c8
      name: 'Cato: Sites connected'
      type: DEPENDENT
      key: cato.sites.connected
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.connectivityStatus=="connected")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 2f31c4de736c4da0a653dee63c786637
      name: 'Cato: Sites disconnected'
      type: DEPENDENT
      key: cato.sites.disconnected
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.connectivityStatus=="disconnected")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: cbdcfe63719e4b9fa4d99462f190a10f
      name: 'Cato: Sites not active (operational)'
      type: DEPENDENT
      key: cato.sites.notactive
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.operationalStatus!="active")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 2617329710aa4581825b588910ccb3e9
      name: 'Cato: Connected hosts (total)'
      type: DEPENDENT
      key: cato.hosts.total
      value_type: UNSIGNED
      description: Sum of hostCount across all sites.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){t+=(s[i].hostCount||0);}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 094731303f744022b812c2041a5b1cc6
      name: 'Cato: Sockets total'
      type: DEPENDENT
      key: cato.sockets.total
      value_type: UNSIGNED
      description: Total Socket devices (includes HA pairs).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){t+=((s[i].devices||[]).length);}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 047bacb6055d437889189084cac06cd3
      name: 'Cato: Sockets disconnected'
      type: DEPENDENT
      key: cato.sockets.disconnected
      value_type: UNSIGNED
      description: Socket devices currently not connected (HA health).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){if(d[j].connected===false)t++;}}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
      triggers:
      - uuid: 5611573ecfa14f9dac00110b2e28997e
        expression: last(/Cato Networks by HTTP/cato.sockets.disconnected)>0
        name: 'Cato: One or more Sockets are disconnected (HA at risk)'
        priority: HIGH
        description: At least one Socket (possibly an HA member) is down.
    - uuid: ee59df2633c54a9796865be617eb04c8
      name: 'Cato: Account throughput downstream'
      type: DEPENDENT
      key: cato.traffic.total.down
      value_type: FLOAT
      description: Aggregated downstream throughput.
      units: Bps
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){t+=(f[j].metrics.bytesDownstream||0);}}return t;
      - type: MULTIPLIER
        parameters:
        - '0.0033333'
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: e7ba665901bd4fbeaf2550e5a85d24cc
      name: 'Cato: Account throughput upstream'
      type: DEPENDENT
      key: cato.traffic.total.up
      value_type: FLOAT
      description: Aggregated upstream throughput.
      units: Bps
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){t+=(f[j].metrics.bytesUpstream||0);}}return t;
      - type: MULTIPLIER
        parameters:
        - '0.0033333'
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: 08aa10d0776f4e85aef2c99f2d220063
      name: 'Cato: Account average RTT'
      type: DEPENDENT
      key: cato.rtt.avg
      value_type: FLOAT
      description: Average RTT across all WAN links.
      units: ms
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0,n=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){if(f[j].metrics.rtt!=null){t+=f[j].metrics.rtt;n++;}}}return n?t/n:0;
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: 46e0260867b944e5a2400e8c2eeff106
      name: 'Cato: Account max packet loss'
      type: DEPENDENT
      key: cato.loss.max
      value_type: FLOAT
      description: Worst packet loss across all WAN links.
      units: '%'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var m=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){var a=f[j].metrics.lostDownstreamPcnt||0,b=f[j].metrics.lostUpstreamPcnt||0;m=Math.max(m,a,b);}}return m;
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: 1fb526eb31e045b4a9aaa50fc6412b49
      name: 'Cato: Sites configured (inventory)'
      type: DEPENDENT
      key: cato.sites.configured
      value_type: UNSIGNED
      description: Total sites configured in the CMA (entityLookup total). 0 if the query is unavailable on your account.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.entityLookup.total
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.entities.raw
      tags:
      - tag: component
        value: account
    - uuid: d2977eb39f8d4835b2bbc63610fb9a2c
      name: 'Cato: Sites missing from snapshot'
      type: CALCULATED
      key: cato.sites.missing
      value_type: FLOAT
      params: last(//cato.sites.configured)-last(//cato.sites.total)
      description: Configured sites not present in live snapshot (drift). Requires the entity inventory query to work.
      tags:
      - tag: component
        value: account
      triggers:
      - uuid: 4773a1689a7844cebd560ba1ef7ccfac
        expression: last(/Cato Networks by HTTP/cato.sites.missing)>0 and last(/Cato Networks by HTTP/cato.sites.configured)>0
        name: 'Cato: {ITEM.LASTVALUE1} site(s) configured but missing from live snapshot'
        priority: AVERAGE
        description: entityLookup reports more sites than accountSnapshot returns.
    - uuid: de001ef45861479d84c3f3f25b7fa38a
      name: 'Cato: Events fetched (queue)'
      type: DEPENDENT
      key: cato.events.total
      value_type: UNSIGNED
      description: Number of events fetched from the queue (max 3000 per fetch).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.eventsFeed.fetchedCount
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.events.raw
      tags:
      - tag: component
        value: events
    - uuid: 9022eff59e224f2aa089a57f54b23ea6
      name: 'Cato: Sites availability (instant %)'
      type: CALCULATED
      key: cato.sla.instant
      value_type: FLOAT
      params: 100*last(//cato.sites.connected)/(last(//cato.sites.total)+(last(//cato.sites.total)=0))
      units: '%'
      description: Instantaneous percentage of sites connected.
      tags:
      - tag: component
        value: sla
    - uuid: d5365b3deec348e8bf61dab9cf52e853
      name: 'Cato: Sites availability (24h %)'
      type: CALCULATED
      key: cato.sla.24h
      value_type: FLOAT
      params: avg(//cato.sla.instant,1d)
      units: '%'
      description: Average site availability over last 24h.
      tags:
      - tag: component
        value: sla
      triggers:
      - uuid: c6cb52351d84474e93865d386c096835
        expression: last(/Cato Networks by HTTP/cato.sla.24h)<{$CATO.SLA.TARGET}
        name: 'Cato: 24h availability below SLA target ({$CATO.SLA.TARGET}%)'
        priority: HIGH
        description: Rolling 24h site availability dropped below the SLA objective.
    - uuid: 40631d52d7fe4d6abc9ab68c4c6d9e21
      name: 'Cato: Sites availability (7d %)'
      type: CALCULATED
      key: cato.sla.7d
      value_type: FLOAT
      params: avg(//cato.sla.instant,7d)
      units: '%'
      description: Average site availability over last 7 days.
      tags:
      - tag: component
        value: sla
    - uuid: 99c340ef29be4f4ab400eed79960933d
      name: 'Cato: Sites availability (30d %)'
      type: CALCULATED
      key: cato.sla.30d
      value_type: FLOAT
      params: avg(//cato.sla.instant,30d)
      units: '%'
      description: Average site availability over last 30 days.
      tags:
      - tag: component
        value: sla
    discovery_rules:
    - uuid: 03a2d65d86c347a99cd05e82eb591757
      name: 'Cato: Site discovery'
      type: DEPENDENT
      key: cato.site.discovery
      delay: '0'
      description: Discovers all sites from accountSnapshot.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites
      master_item:
        key: cato.snapshot.raw
      lld_macro_paths:
      - lld_macro: '{#SITE.ID}'
        path: $.id
      - lld_macro: '{#SITE.NAME}'
        path: $.info.name
      - lld_macro: '{#SITE.TYPE}'
        path: $.info.type
      - lld_macro: '{#POP.NAME}'
        path: $.popName
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.MATCHES}'
          formulaid: A
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: cc8a6745564b4cc09fe65e798b769dac
        name: 'Cato: [{#SITE.NAME}] Connectivity status'
        type: DEPENDENT
        key: cato.site.connectivity[{#SITE.ID}]
        value_type: UNSIGNED
        description: 1 = connected, 0 = disconnected.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){if(s[i].id=='{#SITE.ID}')return s[i].connectivityStatus=='connected'?1:0;}throw 'site not found';
        master_item:
          key: cato.snapshot.raw
        valuemap:
          name: Cato connectivity
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: aeda02fb512b4343910ef5d0fc105881
          expression: last(/Cato Networks by HTTP/cato.site.connectivity[{#SITE.ID}])=0
          name: 'Cato: [{#SITE.NAME}] Site is disconnected from Cato Cloud'
          priority: HIGH
          description: The site lost connectivity to the Cato Cloud PoP.
      - uuid: 498e603ca02c431d99d0003ca4dffa6b
        name: 'Cato: [{#SITE.NAME}] Operational status'
        type: DEPENDENT
        key: cato.site.operational[{#SITE.ID}]
        value_type: CHAR
        description: active / disabled / locked / new ...
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){if(s[i].id=='{#SITE.ID}')return s[i].operationalStatus;}throw 'site not found';
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: fad7a58687274eebb60943da058d5e2f
          expression: last(/Cato Networks by HTTP/cato.site.operational[{#SITE.ID}])<>"active"
          name: 'Cato: [{#SITE.NAME}] Site operational status is not active'
          priority: WARNING
          description: The site is not passing traffic.
      - uuid: 421183f3040e4b8ba9a271392f22105c
        name: 'Cato: [{#SITE.NAME}] Connected PoP'
        type: DEPENDENT
        key: cato.site.pop[{#SITE.ID}]
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data.accountSnapshot.sites[?(@.id=="{#SITE.ID}")].popName.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: cato.snapshot.raw
