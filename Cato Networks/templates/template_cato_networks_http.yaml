    - uuid: b8ef08b767fc498ebdcda4bda3bebd06
      name: 'Cato: Socket / device discovery'
      type: DEPENDENT
      key: cato.device.discovery
      delay: '0'
      description: Discovers every Socket (incl. HA members) from accountSnapshot.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var out=[];for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){out.push({"{#SITE.ID}":String(s[i].id),"{#SITE.NAME}":(s[i].info?s[i].info.name:s[i].id),"{#DEVICE.ID}":String(d[j].id),"{#DEVICE.NAME}":d[j].name,"{#HA.ROLE}":d[j].haRole||"primary"});}}return JSON.stringify(out);
      master_item:
        key: cato.snapshot.raw
      item_prototypes:
      - uuid: 44062ea50e1a4c59bc1755c47cf5f58e
        name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} ({#HA.ROLE}) connected'
        type: DEPENDENT
        key: cato.device.connected[{#DEVICE.ID}]
        value_type: UNSIGNED
        description: 1 = connected, 0 = down.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){if(String(d[j].id)=='{#DEVICE.ID}')return d[j].connected?1:0;}}throw 'device not found';
        master_item:
          key: cato.snapshot.raw
        valuemap:
          name: Cato connectivity
        tags:
        - tag: component
          value: socket
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: a972d8fd380b4cc48428ef6ce6590d15
          expression: last(/Cato Networks by HTTP/cato.device.connected[{#DEVICE.ID}])=0
          name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} ({#HA.ROLE}) is down'
          priority: HIGH
          description: A Socket (HA member) lost connectivity.
      - uuid: 9bf2525321af47079836ec90bb31d4a3
        name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} uptime'
        type: DEPENDENT
        key: cato.device.uptime[{#DEVICE.ID}]
        value_type: FLOAT
        units: uptime
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){if(String(d[j].id)=='{#DEVICE.ID}')return d[j].uptimeSeconds||0;}}throw 'device not found';
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: socket
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: 130de81863144f4cb56af1c5c47a5585
          expression: last(/Cato Networks by HTTP/cato.device.uptime[{#DEVICE.ID}])<600
          name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} rebooted (uptime < 10m)'
          priority: INFO
          description: Socket recently restarted.
      - uuid: f4b4ca75de18402e999d334768ceedc7
        name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} firmware version'
        type: DEPENDENT
        key: cato.device.version[{#DEVICE.ID}]
        value_type: CHAR
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){if(String(d[j].id)=='{#DEVICE.ID}')return (d[j].socketInfo&&d[j].socketInfo.version)?d[j].socketInfo.version:'unknown';}}throw 'device not found';
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: socket
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: 036596d27aa3472d85bb15722d786922
          expression: change(/Cato Networks by HTTP/cato.device.version[{#DEVICE.ID}])<>0 and length(last(/Cato Networks by HTTP/cato.device.version[{#DEVICE.ID}]))>0
          name: 'Cato: [{#SITE.NAME}] Socket {#DEVICE.NAME} firmware changed'
          priority: INFO
          manual_close: 'YES'
    - uuid: defeb06d50e44b5785e64e3212927441
      name: 'Cato: BGP peer discovery'
      type: DEPENDENT
      key: cato.bgp.discovery
      delay: '0'
      description: 'Discovers every BGP peer of every site. Defensive parsing: no BGP -> no prototypes.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var out=[];try{var s=JSON.parse(value).data.accountSnapshot.sites||[];for(var i=0;i<s.length;i++){var sn=(s[i].info&&s[i].info.name)?s[i].info.name:String(s[i].id);var dv=s[i].devices||[];for(var d=0;d<dv.length;d++){var bs=dv[d].bgpStatus;if(!bs)continue;var pl=bs.peers||[];for(var p=0;p<pl.length;p++){out.push({"{#SITE.ID}":String(s[i].id),"{#SITE.NAME}":sn,"{#PEER.NAME}":pl[p].peerName||pl[p].peerIp,"{#PEER.IP}":pl[p].peerIp,"{#PEER.ASN}":String(pl[p].peerAsn)});}}}}catch(e){}return JSON.stringify(out);
      master_item:
        key: cato.bgp.raw
      item_prototypes:
      - uuid: 9bad9b9d84c340a58a4ccdcff80fcc57
        name: 'Cato: [{#SITE.NAME}] BGP {#PEER.NAME} (AS{#PEER.ASN}) state'
        type: DEPENDENT
        key: cato.bgp.state[{#SITE.ID},{#PEER.IP}]
        value_type: UNSIGNED
        description: 1 = Established, 0 = otherwise.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites||[];for(var i=0;i<s.length;i++){var dv=s[i].devices||[];for(var d=0;d<dv.length;d++){var bs=dv[d].bgpStatus;if(!bs)continue;var pl=bs.peers||[];for(var p=0;p<pl.length;p++){if(pl[p].peerIp=='{#PEER.IP}')return (String(pl[p].state).toLowerCase()=='established')?1:0;}}}throw 'peer not found';
        master_item:
          key: cato.bgp.raw
        valuemap:
          name: Cato BGP state
        tags:
        - tag: component
          value: bgp
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: da4797c5145d4e7ca63a0c9540d55d7f
          expression: last(/Cato Networks by HTTP/cato.bgp.state[{#SITE.ID},{#PEER.IP}])=0
          name: 'Cato: [{#SITE.NAME}] BGP peer {#PEER.NAME} is not Established'
          priority: HIGH
          description: The BGP session to {#PEER.IP} (AS{#PEER.ASN}) is down.
      - uuid: 7b6d9bdf655e487389c6e97a234370bf
        name: 'Cato: [{#SITE.NAME}] BGP {#PEER.NAME} advertised routes'
        type: DEPENDENT
        key: cato.bgp.advertised[{#SITE.ID},{#PEER.IP}]
        value_type: UNSIGNED
        description: Prefixes advertised to the BGP peer.
        units: routes
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites||[];for(var i=0;i<s.length;i++){var dv=s[i].devices||[];for(var d=0;d<dv.length;d++){var bs=dv[d].bgpStatus;if(!bs)continue;var pl=bs.peers||[];for(var p=0;p<pl.length;p++){if(pl[p].peerIp=='{#PEER.IP}')return pl[p].advertisedRoutes;}}}throw 'peer not found';
        master_item:
          key: cato.bgp.raw
        tags:
        - tag: component
          value: bgp
        - tag: site
          value: '{#SITE.NAME}'
      - uuid: 787f3f0601f34646a68734f7ef6bd2b4
        name: 'Cato: [{#SITE.NAME}] BGP {#PEER.NAME} received routes'
        type: DEPENDENT
        key: cato.bgp.received[{#SITE.ID},{#PEER.IP}]
        value_type: UNSIGNED
        description: Prefixes received from the peer (dynamic routes learned).
        units: routes
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites||[];for(var i=0;i<s.length;i++){var dv=s[i].devices||[];for(var d=0;d<dv.length;d++){var bs=dv[d].bgpStatus;if(!bs)continue;var pl=bs.peers||[];for(var p=0;p<pl.length;p++){if(pl[p].peerIp=='{#PEER.IP}')return pl[p].receivedRoutes;}}}throw 'peer not found';
        master_item:
          key: cato.bgp.raw
        tags:
        - tag: component
          value: bgp
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: bd5f86cedb534191b751f2f8372ff4f4
          expression: last(/Cato Networks by HTTP/cato.bgp.received[{#SITE.ID},{#PEER.IP}])=0 and last(/Cato Networks by HTTP/cato.bgp.state[{#SITE.ID},{#PEER.IP}])=1
          name: 'Cato: [{#SITE.NAME}] BGP peer {#PEER.NAME} Established but 0 routes received'
          priority: AVERAGE
          description: Session up but no dynamic routes learned (possible filter/route issue).
      - uuid: 7b2b749aafa948ec8ed0e194737731ca
        name: 'Cato: [{#SITE.NAME}] BGP {#PEER.NAME} session uptime'
        type: DEPENDENT
        key: cato.bgp.uptime[{#SITE.ID},{#PEER.IP}]
        value_type: FLOAT
        units: uptime
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites||[];for(var i=0;i<s.length;i++){var dv=s[i].devices||[];for(var d=0;d<dv.length;d++){var bs=dv[d].bgpStatus;if(!bs)continue;var pl=bs.peers||[];for(var p=0;p<pl.length;p++){if(pl[p].peerIp=='{#PEER.IP}')return pl[p].uptime||0;}}}throw 'peer not found';
        master_item:
          key: cato.bgp.raw
        tags:
        - tag: component
          value: bgp
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: 1d7576b055b5468d9c5817f3cd6b6bec
          expression: last(/Cato Networks by HTTP/cato.bgp.uptime[{#SITE.ID},{#PEER.IP}])<300 and last(/Cato Networks by HTTP/cato.bgp.uptime[{#SITE.ID},{#PEER.IP}])>0
          name: 'Cato: [{#SITE.NAME}] BGP peer {#PEER.NAME} recently flapped (uptime < 5m)'
          priority: WARNING
      graph_prototypes:
      - uuid: f131278cf9df4c44bd439ad9f0f25636
        name: 'Cato: [{#SITE.NAME}] BGP {#PEER.NAME} routes'
        graph_items:
        - color: 1A7C11
          item:
            host: Cato Networks by HTTP
            key: cato.bgp.received[{#SITE.ID},{#PEER.IP}]
        - color: 2774A4
          item:
            host: Cato Networks by HTTP
            key: cato.bgp.advertised[{#SITE.ID},{#PEER.IP}]
          sortorder: '1'
