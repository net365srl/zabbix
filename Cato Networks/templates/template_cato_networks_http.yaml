    macros:
    - macro: '{$CATO.API.URL}'
      value: https://api.catonetworks.com/api/v1/graphql2
      description: Cato GraphQL endpoint. Add region prefix if your CMA uses one (e.g. api.us1...).
    - macro: '{$CATO.API.KEY}'
      value: ''
      type: SECRET_TEXT
      description: Cato API key (Resources > API Keys). Restrict it to the Zabbix source IP.
    - macro: '{$CATO.ACCOUNT.ID}'
      value: ''
      description: CMA account ID (Account Info page).
    - macro: '{$CATO.SNAPSHOT.INTERVAL}'
      value: 60s
      description: Polling interval for accountSnapshot.
    - macro: '{$CATO.METRICS.INTERVAL}'
      value: 5m
      description: Polling interval for accountMetrics.
    - macro: '{$CATO.METRICS.TIMEFRAME}'
      value: last.PT5M
      description: TimeFrame for accountMetrics.
    - macro: '{$CATO.BGP.INTERVAL}'
      value: 2m
      description: Polling interval for BGP peer status.
    - macro: '{$CATO.INVENTORY.INTERVAL}'
      value: 1h
      description: Polling interval for entityLookup inventory.
    - macro: '{$CATO.EVENTS.INTERVAL}'
      value: 5m
      description: Polling interval for events summary.
    - macro: '{$CATO.EVENTS.TIMEFRAME}'
      value: last.PT5M
      description: TimeFrame for eventsFeed summary.
    - macro: '{$CATO.LOSS.WARN}'
      value: '3'
      description: Packet loss warning threshold (%).
    - macro: '{$CATO.JITTER.WARN}'
      value: '30'
      description: Jitter warning threshold (ms).
    - macro: '{$CATO.RTT.WARN}'
      value: '150'
      description: RTT warning threshold (ms).
    - macro: '{$CATO.HEALTH.WARN}'
      value: '70'
      description: Link health warning threshold (below = warning).
    - macro: '{$CATO.SLA.TARGET}'
      value: '99.9'
      description: Site availability SLA objective (%).
    - macro: '{$CATO.SITE.NAME.MATCHES}'
      value: .*
      description: Discover sites whose name matches this regex.
    - macro: '{$CATO.SITE.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Exclude sites matching this regex.
