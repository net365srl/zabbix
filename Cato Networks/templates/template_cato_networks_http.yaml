zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 00b30d1d5fe5409e8625f33653ba35f6
    name: Templates/Network devices
  templates:
  - uuid: f88088f93bcc4800beffd035b4393c00
    template: Cato Networks by HTTP
    name: Cato Networks by HTTP
    description: |-
      Template to monitor a Cato Networks SASE account through the Cato GraphQL API (HTTP agent).

      Master HTTP items call the Cato GraphQL API; LLD + dependent items build per-site / per-WAN-link /
      per-BGP-peer metrics WITHOUT extra API calls, respecting Cato API rate limiting.

      Cato GraphQL APIs consumed: accountSnapshot (availability), accountMetrics (quality incl. health score),
      entityLookup (inventory/drift), eventsFeed (event trending), and BGP peer status (dynamic routing).

      Model: ONE Zabbix host = ONE Cato account.

      Setup: 1) Generate a Cato API key (read: Sites, Sites Overview, Events) restricted to the Zabbix source IP.
      2) Link this template to a host. 3) Fill {$CATO.API.KEY} and {$CATO.ACCOUNT.ID}; adjust {$CATO.API.URL}
      for your region if needed. JSON parsing is defensive; validate field names in the GraphQL Playground if an
      item becomes unsupported. License: MIT-0. Version 2.0.1.
    wizard_ready: 'YES'
    vendor:
      name: Community
      version: 2.0.1
    groups:
    - name: Templates/Network devices
    items:
    - uuid: c3178ff34b1e4b7ca0974607dcf49a39
      name: 'Cato: Get account snapshot'
      type: HTTP_AGENT
      key: cato.snapshot.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.SNAPSHOT.INTERVAL}'
      timeout: 30s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query accountSnapshot($accountID:ID!){accountSnapshot(accountID:$accountID){id sites{id connectivityStatus operationalStatus lastConnected connectedSince popName hostCount info{name type countryName region} devices{id name connected haRole lastConnected lastPopName type uptimeSeconds socketInfo{serial version} interfaces{id name physicalPort connected}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: snapshot
    - uuid: 4f8ff4821272463a9ea9a16eb4db9516
      name: 'Cato: Get account metrics'
      type: HTTP_AGENT
      key: cato.metrics.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.METRICS.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query accountMetrics($accountID:ID!,$timeFrame:TimeFrame!){accountMetrics(accountID:$accountID,timeFrame:$timeFrame,groupDevices:true){from to sites{id name interfaces{name metrics{bytesDownstream bytesUpstream bytesTotal lostDownstreamPcnt lostUpstreamPcnt jitterUpstream jitterDownstream rtt health packetsDiscardedDownstream packetsDiscardedUpstream}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}","timeFrame":"{$CATO.METRICS.TIMEFRAME}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: metrics
    - uuid: 96d2b6a0103a48c0897b39a1a3a5e332
      name: 'Cato: Get BGP status'
      type: HTTP_AGENT
      key: cato.bgp.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.BGP.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query bgp($accountID:ID!){accountSnapshot(accountID:$accountID){sites{id info{name} devices{bgpStatus{peers{peerName peerAsn catoAsn peerIp state uptime advertisedRoutes receivedRoutes}}}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: bgp
      description: BGP peer runtime status per site. If unsupported on your account, verify field names via GraphQL introspection. BGP LLD parsing is defensive.
    - uuid: 1a73fe07029143178d53a15b579b6b58
      name: 'Cato: Get entity inventory (sites)'
      type: HTTP_AGENT
      key: cato.entities.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.INVENTORY.INTERVAL}'
      timeout: 30s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query entityLookup($accountID:ID!){entityLookup(accountID:$accountID,type:site){total items{entity{id name type}}}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: entities
      description: 'entityLookup type=site: authoritative count of configured sites for drift detection.'
    - uuid: 3809fb2c055d47ee9642c6a01b2304f8
      name: 'Cato: Get events summary'
      type: HTTP_AGENT
      key: cato.events.raw
      history: '0'
      trends: '0'
      value_type: TEXT
      delay: '{$CATO.EVENTS.INTERVAL}'
      timeout: 60s
      url: '{$CATO.API.URL}'
      posts: '{"query":"query events($accountID:ID!,$timeFrame:TimeFrame!){eventsFeed(accountIDs:[$accountID],timeFrame:$timeFrame,filters:[]){accounts{records{count}} fetchedCount}}","variables":{"accountID":"{$CATO.ACCOUNT.ID}","timeFrame":"{$CATO.EVENTS.TIMEFRAME}"}}'
      request_method: POST
      post_type: JSON
      headers:
      - name: x-api-key
        value: '{$CATO.API.KEY}'
      - name: Content-Type
        value: application/json
      tags:
      - tag: component
        value: raw
      - tag: source
        value: events
      description: eventsFeed summary for trending event volumes. Disable if account restricts events API.
    - uuid: ee4ce44fdeac419ba70cf64399a6f07e
      name: 'Cato: API errors (snapshot)'
      type: DEPENDENT
      key: cato.snapshot.errors
      value_type: TEXT
      description: Non-empty when accountSnapshot returns an errors[] array.
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: health
    - uuid: 819da380da7940678c1d167d4ed4b6af
      name: 'Cato: Sites total'
      type: DEPENDENT
      key: cato.sites.total
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites.length()
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: d40cc3a7771f4a4f83bcfc15d6a33fe1
      name: 'Cato: Sites connected'
      type: DEPENDENT
      key: cato.sites.connected
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.connectivityStatus=="connected")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: b9c99293e21b462d88e51d10497e7f4f
      name: 'Cato: Sites disconnected'
      type: DEPENDENT
      key: cato.sites.disconnected
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.connectivityStatus=="disconnected")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 8bad3f27038d4c04b97b745b9f3c53b6
      name: 'Cato: Sites not active (operational)'
      type: DEPENDENT
      key: cato.sites.notactive
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites[?(@.operationalStatus!="active")].length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: c0445624030b4d279c47fa0a3b24bef9
      name: 'Cato: Connected hosts (total)'
      type: DEPENDENT
      key: cato.hosts.total
      value_type: UNSIGNED
      description: Sum of hostCount across all sites.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){t+=(s[i].hostCount||0);}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: ac6fee6826954f7a9823cf8525bcf12e
      name: 'Cato: Sockets total'
      type: DEPENDENT
      key: cato.sockets.total
      value_type: UNSIGNED
      description: Total Socket devices (includes HA pairs).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){t+=((s[i].devices||[]).length);}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
    - uuid: 63727020f8504ae4823334c23e05f96d
      name: 'Cato: Sockets disconnected'
      type: DEPENDENT
      key: cato.sockets.disconnected
      value_type: UNSIGNED
      description: Socket devices currently not connected (HA health).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountSnapshot.sites||[];var t=0;for(var i=0;i<s.length;i++){var d=s[i].devices||[];for(var j=0;j<d.length;j++){if(d[j].connected===false)t++;}}return t;
      master_item:
        key: cato.snapshot.raw
      tags:
      - tag: component
        value: account
      triggers:
      - uuid: 41902bc4d7fb493d9f97a2d9be006e7a
        expression: last(/Cato Networks by HTTP/cato.sockets.disconnected)>0
        name: 'Cato: One or more Sockets are disconnected (HA at risk)'
        priority: HIGH
        description: At least one Socket (possibly an HA member) is down.
    - uuid: 0e165821f95a4068a4cf87950fd03df2
      name: 'Cato: Account throughput downstream'
      type: DEPENDENT
      key: cato.traffic.total.down
      value_type: FLOAT
      description: Aggregated downstream throughput across all WAN links.
      units: Bps
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){t+=(f[j].metrics.bytesDownstream||0);}}return t;
      - type: MULTIPLIER
        parameters:
        - '0.0033333'
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: c34a210a9ba4468f949db36492c9a2a3
      name: 'Cato: Account throughput upstream'
      type: DEPENDENT
      key: cato.traffic.total.up
      value_type: FLOAT
      description: Aggregated upstream throughput across all WAN links.
      units: Bps
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){t+=(f[j].metrics.bytesUpstream||0);}}return t;
      - type: MULTIPLIER
        parameters:
        - '0.0033333'
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: a664174d33d643298ce47b89808cc2d1
      name: 'Cato: Account average RTT'
      type: DEPENDENT
      key: cato.rtt.avg
      value_type: FLOAT
      description: Average round-trip time across all WAN links.
      units: ms
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0,n=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){if(f[j].metrics.rtt!=null){t+=f[j].metrics.rtt;n++;}}}return n?t/n:0;
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: 1eced580cb534815b6ba9bdd74355f21
      name: 'Cato: Account max packet loss'
      type: DEPENDENT
      key: cato.loss.max
      value_type: FLOAT
      description: Worst (max) packet loss across all WAN links.
      units: '%'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var m=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){var a=f[j].metrics.lostDownstreamPcnt||0,b=f[j].metrics.lostUpstreamPcnt||0;m=Math.max(m,a,b);}}return m;
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: fce3f95dbe7248c9bd1ab31448c30ce0
      name: 'Cato: Account average health score'
      type: DEPENDENT
      key: cato.health.avg
      value_type: FLOAT
      description: Average Cato link health score (0-100) across all WAN links.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s=JSON.parse(value).data.accountMetrics.sites||[];var t=0,n=0;for(var i=0;i<s.length;i++){var f=s[i].interfaces||[];for(var j=0;j<f.length;j++){if(f[j].metrics.health!=null){t+=f[j].metrics.health;n++;}}}return n?t/n:0;
      master_item:
        key: cato.metrics.raw
      tags:
      - tag: component
        value: account
    - uuid: 0440976ed35340a78725145a4fdaddde
      name: 'Cato: Sites configured (inventory)'
      type: DEPENDENT
      key: cato.sites.configured
      value_type: UNSIGNED
      description: Total sites configured in the CMA (entityLookup total).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.entityLookup.total
        error_handler: DISCARD_VALUE
      master_item:
        key: cato.entities.raw
      tags:
      - tag: component
        value: account
    - uuid: 1a8213e54048440e944b2bb07ca32260
      name: 'Cato: Sites missing from snapshot'
      type: CALCULATED
      key: cato.sites.missing
      value_type: FLOAT
      params: last(//cato.sites.configured)-last(//cato.sites.total)
      description: Configured sites not present in live snapshot (drift).
      tags:
      - tag: component
        value: account
      triggers:
      - uuid: 4ec3559e07a74b17b25dce09a746af52
        expression: last(/Cato Networks by HTTP/cato.sites.missing)>0
        name: 'Cato: {ITEM.LASTVALUE1} site(s) configured but missing from live snapshot'
        priority: AVERAGE
        description: entityLookup reports more sites than accountSnapshot returns.
    - uuid: 1a2ef3a3ae204cbcae7ef5a81b614606
      name: 'Cato: Events total (timeframe)'
      type: DEPENDENT
      key: cato.events.total
      value_type: UNSIGNED
      description: Total events reported by eventsFeed over the events timeframe.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.eventsFeed.fetchedCount
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: cato.events.raw
      tags:
      - tag: component
        value: events
    - uuid: d36dd200a81e44c785a86895e196ba38
      name: 'Cato: Events API errors'
      type: DEPENDENT
      key: cato.events.errors
      value_type: TEXT
      description: Non-empty if eventsFeed returns errors[].
      history: 7d
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.errors[*].message
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: cato.events.raw
      tags:
      - tag: component
        value: health
    - uuid: a854dc761915437abb00d58586c31b91
      name: 'Cato: Sites availability (instant %)'
      type: CALCULATED
      key: cato.sla.instant
      value_type: FLOAT
      params: 100*last(//cato.sites.connected)/(last(//cato.sites.total)+(last(//cato.sites.total)=0))
      units: '%'
      description: Instantaneous percentage of sites connected. Basis for SLA trends.
      tags:
      - tag: component
        value: sla
    - uuid: 336efe31f05842b2a68b408aee33c3b9
      name: 'Cato: Sites availability (24h %)'
      type: CALCULATED
      key: cato.sla.24h
      value_type: FLOAT
      params: avg(//cato.sla.instant,1d)
      units: '%'
      description: Average site availability over last 24h (SLA).
      tags:
      - tag: component
        value: sla
      triggers:
      - uuid: 9cfa8bd723f14f80a4a45263c9b467b4
        expression: last(/Cato Networks by HTTP/cato.sla.24h)<{$CATO.SLA.TARGET}
        name: 'Cato: 24h availability below SLA target ({$CATO.SLA.TARGET}%)'
        priority: HIGH
        description: Rolling 24h site availability dropped below the SLA objective.
    - uuid: e748390325b440ff88f0ccc39b0095a8
      name: 'Cato: Sites availability (7d %)'
      type: CALCULATED
      key: cato.sla.7d
      value_type: FLOAT
      params: avg(//cato.sla.instant,7d)
      units: '%'
      description: Average site availability over last 7 days (SLA).
      tags:
      - tag: component
        value: sla
    - uuid: 5ab55dc382a846dda0b117f840af2ef5
      name: 'Cato: Sites availability (30d %)'
      type: CALCULATED
      key: cato.sla.30d
      value_type: FLOAT
      params: avg(//cato.sla.instant,30d)
      units: '%'
      description: Average site availability over last 30 days (SLA).
      tags:
      - tag: component
        value: sla
    - uuid: 21bde86e0ae041889fc2ecef7f282329
      name: 'Cato: Average health (24h %)'
      type: CALCULATED
      key: cato.health.24h
      value_type: FLOAT
      params: avg(//cato.health.avg,1d)
      description: Average link health score over last 24h.
      tags:
      - tag: component
        value: sla
    discovery_rules:
    - uuid: deb463f574ee42e4bdf5104d515e00d3
      name: 'Cato: Site discovery'
      type: DEPENDENT
      key: cato.site.discovery
      delay: '0'
      description: Discovers all sites from accountSnapshot.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.accountSnapshot.sites
      master_item:
        key: cato.snapshot.raw
      lld_macro_paths:
      - lld_macro: '{#SITE.ID}'
        path: $.id
      - lld_macro: '{#SITE.NAME}'
        path: $.info.name
      - lld_macro: '{#SITE.TYPE}'
        path: $.info.type
      - lld_macro: '{#POP.NAME}'
        path: $.popName
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.MATCHES}'
          formulaid: A
        - macro: '{#SITE.NAME}'
          value: '{$CATO.SITE.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: ec136228d19941c6aee537134fd579f5
        name: 'Cato: [{#SITE.NAME}] Connectivity status'
        type: DEPENDENT
        key: cato.site.connectivity[{#SITE.ID}]
        value_type: UNSIGNED
        description: 1 = connected, 0 = disconnected.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){if(s[i].id=='{#SITE.ID}')return s[i].connectivityStatus=='connected'?1:0;}throw 'site not found';
        master_item:
          key: cato.snapshot.raw
        valuemap:
          name: Cato connectivity
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: 045334e72b164370be3d05bfdd6789ed
          expression: last(/Cato Networks by HTTP/cato.site.connectivity[{#SITE.ID}])=0
          name: 'Cato: [{#SITE.NAME}] Site is disconnected from Cato Cloud'
          priority: HIGH
          description: The site lost connectivity to the Cato Cloud PoP.
      - uuid: a9d3b9a61b934ec2bcb7a91c5bc86439
        name: 'Cato: [{#SITE.NAME}] Operational status'
        type: DEPENDENT
        key: cato.site.operational[{#SITE.ID}]
        value_type: CHAR
        description: active / disabled / locked / new ...
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - var s=JSON.parse(value).data.accountSnapshot.sites;for(var i=0;i<s.length;i++){if(s[i].id=='{#SITE.ID}')return s[i].operationalStatus;}throw 'site not found';
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
        trigger_prototypes:
        - uuid: c7c13585d17642ddb71848f75a8c50ac
          expression: last(/Cato Networks by HTTP/cato.site.operational[{#SITE.ID}])<>"active"
          name: 'Cato: [{#SITE.NAME}] Site operational status is not active'
          priority: WARNING
          description: The site is not passing traffic (disabled/locked/new).
      - uuid: 4a730211d506460cb5530d724a472459
        name: 'Cato: [{#SITE.NAME}] Connected PoP'
        type: DEPENDENT
        key: cato.site.pop[{#SITE.ID}]
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data.accountSnapshot.sites[?(@.id=="{#SITE.ID}")].popName.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
      - uuid: 436fa0d043ea4a22974224efc848983a
        name: 'Cato: [{#SITE.NAME}] Connected hosts'
        type: DEPENDENT
        key: cato.site.hostcount[{#SITE.ID}]
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data.accountSnapshot.sites[?(@.id=="{#SITE.ID}")].hostCount.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: cato.snapshot.raw
        tags:
        - tag: component
          value: site
        - tag: site
          value: '{#SITE.NAME}'
      - uuid: dd72cecfa52e4a979a38620f2dc0b9f8
        name: 'Cato: [{#SITE.NAME}] Connected since'
        type: DEPENDENT
        key: cato.site.connectedsince[{#SITE.ID}]
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data.accountSnapshot.sites[?(@.id=="{#SITE.ID}")].connectedSince.first()
          error_handler: DISCARD_VALUE
        master_item:
