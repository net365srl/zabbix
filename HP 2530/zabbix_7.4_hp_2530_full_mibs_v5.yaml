zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 50186a1efa164a0bad5c71028ae29aff
    name: Templates/Network devices
  templates:
  - uuid: bf7d65ccc99d425bbf25a20b20f56320
    template: HP Aruba 2530 by SNMP
    name: HP Aruba 2530 by SNMP
    description: 'Zabbix 7.4 template for HP/Aruba 2530 family switches by SNMP.


      Includes standard system polling, IF-MIB interface LLD with HC counters, errors/discards/speed, aggregate inbound/outbound throughput, interface transition alert with 2-hour closure window, standard and HP vendor trap
      classification, all 42 HP Fault Finder types, HP management login failures on WEB-UI/SSH/TELNET, and unmatched-trap fallback.


      MIB source folder /copilot/mib-2530 contains 205 search results. The files explicitly surfaced and considered in this build are:

      - IEEE8021-SECY-MIB-200610020000Z.mib

      - rfc3417.mib

      - rfc3419.mib

      - rfc4673.mib

      - rfc4022.mib

      - rfc4293.mib

      - rfc4836.mib

      - rfc4113.mib

      - rfc4001.mib

      - rfc4292.mib

      - hpicfBfd.mib

      - hpicfVrrpv3.mib

      - hpicfBasic.mib

      - hpicfBridge.mib

      - hpicfGppc.mib

      - hpSwitchErrorMsg.mib

      - hpicfAuth.mib

      - hpicfDeviceMonitor.mib

      - hpicfOid.mib

      - hpicfOspf.mib

      - hpicfDhcpv6Relay.mib

      - hpicfDhcpSnoop.mib

      - hpicfRateLimit.mib

      - hpicfOspfv3.mib

      - HP_Networking_MIBs_Loading_Order.html

      - readme.txt


      The template uses numeric standard OIDs for polling and symbolic-or-numeric regex matching for traps. Presence of a MIB file does not prove that every object is implemented by every 2530 firmware/model; unverified chassis-only
      polling was intentionally excluded to avoid No Such Object errors. Load hpicfOid.mib before other HP vendor MIBs when compiling the source set.


      Revision v2: enabled HP global CPU, free-memory, fan, primary/secondary PSU and temperature-state polling. These HP vendor OIDs are intentionally enabled so actual support is determined by the target 2530 model/firmware.
      Unsupported OIDs may become unsupported in Zabbix and can then be disabled per host/template.'
