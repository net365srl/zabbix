      mappings:
      - value: '1'
        newvalue: noRedundantModule
      - value: '2'
        newvalue: noFailure
      - value: '3'
        newvalue: unknownReason
      - value: '4'
        newvalue: mismatchOS
      - value: '5'
        newvalue: failedSelftest
      - value: '6'
        newvalue: communicationFailure
      - value: '7'
        newvalue: redundancyDisable
    - uuid: 740db6672d5045b09b0d30a046df6287
      name: HP-ICF::Enabled status
