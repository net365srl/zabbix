      item_prototypes:
      - uuid: 905aceea8bd8478abb4c2a8dce18e7ab
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.status[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        trends: 365d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: IF-MIB::ifOperStatus
        trigger_prototypes:
        - uuid: 9c851843c8c349ac8cf01c5af8a53ed0
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/HP Aruba 2530 by SNMP/net.if.status[{#SNMPINDEX}])<>1 and count(/HP Aruba 2530 by SNMP/net.if.status[{#SNMPINDEX}],2h,"eq",1)>0'
          name: 'Interface {#IFNAME}: Link down'
          priority: INFO
          description: Information event generated only after a transition from up to a non-up state. If the interface stays down, the problem closes automatically when the last up sample leaves the 2-hour evaluation window.
            If the interface returns up earlier, it closes immediately.
      - uuid: ca2e0f0ed64b4811aedf798fc1ca4177
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
